name: Release candidate

on:
  workflow_dispatch:
  push:
    tags: [v0.1.0]

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/getviset/viset
  RELEASE_TAG: v0.1.0

jobs:
  guard:
    name: Immutable release guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check canonical source and accepted gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "getviset/Viset"
          git merge-base --is-ancestor \
            fbaf359f2453b8ba519c587298a8ae12e2fc09c0 \
            "$GITHUB_SHA"

          for workflow in portability.yml nix.yml; do
            successful_runs="$(
              gh run list \
                --repo getviset/Viset \
                --workflow "$workflow" \
                --commit "$GITHUB_SHA" \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq length
            )"
            test "$successful_runs" = 1 || {
              echo "No successful $workflow run exists for $GITHUB_SHA." >&2
              exit 1
            }
          done

      - name: Check tag, release, and GHCR availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          github_status() {
            curl --silent --show-error \
              --output "$RUNNER_TEMP/github-response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          tag_status="$(github_status "$GITHUB_API_URL/repos/getviset/Viset/git/ref/tags/$RELEASE_TAG")"
          release_status="$(github_status "$GITHUB_API_URL/repos/getviset/Viset/releases/tags/$RELEASE_TAG")"
          test "$release_status" = 404 || {
            echo "Release $RELEASE_TAG is unavailable (HTTP $release_status)." >&2
            cat "$RUNNER_TEMP/github-response" >&2
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$tag_status" = 404 || {
              echo "Tag $RELEASE_TAG is unavailable (HTTP $tag_status)." >&2
              exit 1
            }
          else
            test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
            test "$tag_status" = 200 || {
              echo "Tag $RELEASE_TAG did not resolve (HTTP $tag_status)." >&2
              exit 1
            }
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi

          registry_token="$(
            curl --fail --silent --show-error \
              --user "$GITHUB_ACTOR:$GH_TOKEN" \
              'https://ghcr.io/token?service=ghcr.io&scope=repository:getviset/viset:pull' |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          )"
          for tag in "$RELEASE_TAG" "$RELEASE_TAG-amd64" "$RELEASE_TAG-arm64"; do
            status="$(
              curl --silent --show-error \
                --output "$RUNNER_TEMP/registry-response" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $registry_token" \
                --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/getviset/viset/manifests/$tag"
            )"
            test "$status" = 404 || {
              echo "GHCR tag $tag is unavailable (HTTP $status)." >&2
              cat "$RUNNER_TEMP/registry-response" >&2
              exit 1
            }
          done

  archives:
    name: Archive ${{ matrix.rid }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            executable: viset
            capture_smoke: true
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            executable: viset
            capture_smoke: false
          - rid: win-x64
            runner: windows-2025
            executable: viset.exe
            capture_smoke: false
          - rid: win-arm64
            runner: windows-11-arm
            executable: viset.exe
            capture_smoke: false
          - rid: osx-arm64
            runner: macos-15
            executable: viset
            capture_smoke: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore Viset.slnx --locked-mode

      - name: Publish Native AOT
        shell: bash
        run: |
          set -o pipefail
          dotnet publish src/Viset.Cli/Viset.Cli.fsproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --no-restore \
            2>&1 | tee "publish-${{ matrix.rid }}.log"

      - name: Check Native AOT product
        shell: bash
        run: |
          set -euo pipefail
          publish_directory="src/Viset.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish"
          binary="$publish_directory/${{ matrix.executable }}"
          python .config/verify-aot-log.py "publish-${{ matrix.rid }}.log"
          test "$("$binary" --version)" = "viset 0.1.0"
          "$binary" --help | grep -Fq "viset capture CAPTURE.lua"
          python .config/verify-native-sidecars.py "$binary"

      - name: Package deterministic archive
        shell: bash
        run: |
          python scripts/release.py package \
            --rid "${{ matrix.rid }}" \
            --publish-directory "src/Viset.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish" \
            --output-directory release-asset

      - name: Capture smoke from archive
        if: matrix.capture_smoke
        shell: bash
        run: |
          mkdir extracted
          tar -xzf "release-asset/viset-v0.1.0-${{ matrix.rid }}.tar.gz" -C extracted
          VISET_END_TO_END_BINARY="$PWD/extracted/${{ matrix.executable }}" \
          VISET_END_TO_END_BROWSER_ARGUMENTS=--no-sandbox \
            dotnet test tests/Viset.EndToEnd/Viset.EndToEnd.fsproj \
              --configuration Release \
              --no-restore \
              -- --filter-query "/[Category=Smoke]"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.rid }}
          path: release-asset/*
          if-no-files-found: error
          retention-days: 7

  images:
    name: Container ${{ matrix.architecture }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            architecture: amd64
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and inspect Nix container
        shell: bash
        run: |
          set -euo pipefail
          nix build ".#packages.${{ matrix.system }}.container" --print-build-logs
          mkdir container-asset
          cp --dereference result \
            "container-asset/viset-v0.1.0-${{ matrix.architecture }}.docker.tar.gz"
          docker load \
            --input "container-asset/viset-v0.1.0-${{ matrix.architecture }}.docker.tar.gz"
          test "$(
            docker image inspect \
              "$IMAGE:$RELEASE_TAG-${{ matrix.architecture }}" \
              --format '{{.Architecture}}'
          )" = "${{ matrix.architecture }}"
          test "$(
            docker run --rm \
              "$IMAGE:$RELEASE_TAG-${{ matrix.architecture }}" \
              --version
          )" = "viset 0.1.0"

      - name: Capture smoke in Nix container
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$RUNNER_TEMP/viset-container"
          cat > "$wrapper" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm \
            --volume "$PWD:$PWD" \
            --workdir "$PWD" \
            "${IMAGE}:${RELEASE_TAG}-${CONTAINER_ARCHITECTURE}" \
            "$@"
          EOF
          chmod +x "$wrapper"
          # $1 is expanded by the nested Bash command.
          # shellcheck disable=SC2016
          env -u VISET_BROWSER nix develop ".#devShells.${{ matrix.system }}.default" \
            --command bash -c \
              'dotnet restore Viset.slnx --locked-mode &&
               VISET_END_TO_END_BINARY="$1" dotnet test tests/Viset.EndToEnd/Viset.EndToEnd.fsproj --configuration Release --no-restore -- --filter-query "/[Category=Smoke]"' \
              bash "$wrapper"
        env:
          CONTAINER_ARCHITECTURE: ${{ matrix.architecture }}

      - name: Attest candidate container archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: container-asset/*

      - name: Upload container archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-${{ matrix.architecture }}
          path: container-asset/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble candidate
    needs: [guard, archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate and verify checksums
        run: python scripts/release.py checksums release-assets

      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*

      - name: Upload assembled candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish-images:
    name: Publish multi-architecture image
    if: github.event_name == 'push'
    needs: [guard, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      amd64-digest: ${{ steps.push.outputs.amd64_digest }}
      arm64-digest: ${{ steps.push.outputs.arm64_digest }}
      manifest-digest: ${{ steps.push.outputs.manifest_digest }}
    steps:
      - name: Download container archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: container-*
          path: container-assets
          merge-multiple: true

      - name: Log in to GHCR
        shell: bash
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Recheck immutable GHCR tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry_token="$(
            curl --fail --silent --show-error \
              --user "$GITHUB_ACTOR:$GH_TOKEN" \
              'https://ghcr.io/token?service=ghcr.io&scope=repository:getviset/viset:pull' |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          )"
          for tag in "$RELEASE_TAG" "$RELEASE_TAG-amd64" "$RELEASE_TAG-arm64"; do
            status="$(
              curl --silent --show-error \
                --output "$RUNNER_TEMP/registry-response" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $registry_token" \
                --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/getviset/viset/manifests/$tag"
            )"
            test "$status" = 404 || {
              echo "Refusing to overwrite GHCR tag $tag (HTTP $status)." >&2
              cat "$RUNNER_TEMP/registry-response" >&2
              exit 1
            }
          done

      - name: Push architecture images and manifest
        id: push
        shell: bash
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            docker load \
              --input "container-assets/viset-v0.1.0-$architecture.docker.tar.gz"
            docker push "$IMAGE:$RELEASE_TAG-$architecture"
            digest="$(
              docker image inspect \
                "$IMAGE:$RELEASE_TAG-$architecture" \
                --format '{{index .RepoDigests 0}}' |
                sed 's/^.*@//'
            )"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "${architecture}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

          docker manifest create "$IMAGE:$RELEASE_TAG" \
            "$IMAGE@$(grep '^amd64_digest=' "$GITHUB_OUTPUT" | cut -d= -f2)" \
            "$IMAGE@$(grep '^arm64_digest=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          manifest_digest="$(docker manifest push "$IMAGE:$RELEASE_TAG" | tail -n 1)"
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "manifest_digest=$manifest_digest" >> "$GITHUB_OUTPUT"
          docker manifest inspect "$IMAGE:$RELEASE_TAG" > manifest.json
          python3 - <<'PY'
          import json

          with open("manifest.json", encoding="utf-8") as stream:
              manifest = json.load(stream)
          architectures = {
              item.get("platform", {}).get("architecture")
              for item in manifest.get("manifests", [])
          }
          if architectures != {"amd64", "arm64"}:
              raise RuntimeError(f"unexpected manifest architectures: {architectures}")
          PY

      - name: Attest amd64 image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/getviset/viset
          subject-digest: ${{ steps.push.outputs.amd64_digest }}
          push-to-registry: true

      - name: Attest arm64 image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/getviset/viset
          subject-digest: ${{ steps.push.outputs.arm64_digest }}
          push-to-registry: true

      - name: Attest multi-architecture image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/getviset/viset
          subject-digest: ${{ steps.push.outputs.manifest_digest }}
          push-to-registry: true

  publish-release:
    name: Publish GitHub release
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.guard.result == 'success' &&
      needs.assemble.result == 'success' &&
      needs.publish-images.result == 'success'
    needs: [guard, assemble, publish-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Recheck immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify release tag still names this source
        run: test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets

      - name: Create immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo getviset/Viset \
            --verify-tag \
            --title "Viset 0.1.0" \
            --notes "Five browser-free Native AOT archives, deterministic checksums, GitHub attestations, and the smoke-tested multi-architecture GHCR image ghcr.io/getviset/viset:v0.1.0."
