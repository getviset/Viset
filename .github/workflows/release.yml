name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    name: Run reusable release workflow
    uses: alsi-lawr/package-release-workflows/.github/workflows/package-dotnet.yml@main
    secrets:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      PACKAGE_REPOSITORY_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
    with:
      dotnet_version: '10.0.301'
      dotnet_project_path: src/Viset.Cli/Viset.Cli.fsproj
      package_publish_matrix: '[{"rid":"linux-x64","runner":"ubuntu-26.04","machine":"x86_64","executable":"artifacts/publish/linux-x64/viset"},{"rid":"linux-arm64","runner":"ubuntu-26.04-arm","machine":"aarch64","executable":"artifacts/publish/linux-arm64/viset"},{"rid":"osx-arm64","runner":"macos-latest","machine":"arm64","executable":"artifacts/publish/osx-arm64/viset"},{"rid":"win-x64","runner":"windows-latest","machine":"amd64","executable":"artifacts/publish/win-x64/viset.exe"},{"rid":"win-arm64","runner":"windows-11-arm","machine":"arm64","executable":"artifacts/publish/win-arm64/viset.exe"}]'
      package_publish_prepare_script: packaging/publish/prepare.py
      package_smoke_script: packaging/smoke/native_smoke.py
      package_name: viset
      command_name: viset
      release_name: Viset
      smoke_script: packaging/smoke/native_smoke.py
      container_smoke_script: packaging/smoke/container_smoke.py
      release_title_prefix: Viset
      brew_formula_path: artifacts/package-metadata/viset/brew/Formula/viset.rb
      scoop_manifest_path: artifacts/package-metadata/viset/scoop/bucket/viset.json
      chocolatey_nuspec_path: artifacts/package-metadata/viset/chocolatey/viset/viset.nuspec
      winget_manifest_prefix: artifacts/package-metadata/viset/winget/manifests/a/alsi-lawr/Viset
      publish_github_release: true
      publish_homebrew: true
      publish_scoop: true
      publish_winget: true
      publish_nixpkgs: true
      publish_chocolatey: true
      publish_docker_hub: false
      publish_nix_images: true
      promote_latest: true
      run_package_tests: true
      run_homebrew_test: true
      run_windows_packaging_tests: true
      run_winget_test: true
      jreleaser_image: jreleaser/jreleaser-slim:v1.25.0
      jreleaser_config: packaging/jreleaser/jreleaser.yml
      package_metadata_finalize_script: packaging/jreleaser/finalize_metadata.sh
      winget_upstream_repo: microsoft/winget-pkgs
      winget_fork_owner: alsi-lawr
      winget_fork_repo: winget-pkgs
      winget_branch_prefix: winget-viset-v
      nix_upstream_repo: NixOS/nixpkgs
      nix_fork_owner: alsi-lawr
      nix_fork_repo: nixpkgs
      nix_branch_prefix: viset-v
      nix_package_name: viset
      nix_package_template_path: packaging/nix/nixpkgs-package.nix
      nix_package_dependencies_path: packaging/nix/deps.json
      docker_build_matrix: '[]'
      docker_manifest_images: '[]'
      ghcr_build_matrix: '[{"kind":"viset","smoke_kind":"viset","arch":"amd64","runner":"ubuntu-26.04","output":"container","image":"ghcr.io/getviset/viset"},{"kind":"viset","smoke_kind":"viset","arch":"arm64","runner":"ubuntu-26.04-arm","output":"container","image":"ghcr.io/getviset/viset"}]'
      ghcr_manifest_images: '["ghcr.io/getviset/viset"]'
      promotion_image_matrix: '["ghcr.io/getviset/viset"]'
